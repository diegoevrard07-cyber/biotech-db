[project]
name = "biotech-edge-engine"
version = "0.2.0"
description = "Decision-support engine for small-cap biotech catalyst trading (GBM/oncology-CNS)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# Only collect the real test suite — scripts/ contains CLI utilities whose
# names may match test patterns.
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
