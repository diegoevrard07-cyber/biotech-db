# Optional local Postgres for development/demo — an alternative to Supabase.
#
#   docker compose up -d
#   # then set in .env:
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/biotech
#
# Data persists in the named volume `pgdata`. This is a dev convenience only;
# the project's production state lives in the configured DATABASE_URL.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biotech
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d biotech"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
