name: Daily Data Refresh

# Keeps edge_scores, prices, catalysts, and positioning current so the paper
# autopilot trades on fresh signals. Runs the fail-soft full pipeline daily,
# before the autopilot job. Writes to Supabase.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL, POE_API_KEY, SEC_USER_AGENT

on:
  schedule:
    - cron: "0 22 * * *"   # daily 22:00 UTC, after US close (closes are final)
  workflow_dispatch:

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: UTC
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      POE_API_KEY: ${{ secrets.POE_API_KEY }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full pipeline refresh (fail-soft)
        run: python scripts/refresh_all.py

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log-${{ github.run_id }}
          path: data/logs/
          if-no-files-found: ignore
          retention-days: 14
